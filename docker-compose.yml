services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dreamify
      POSTGRES_USER: dreamify
      POSTGRES_PASSWORD: dreamify_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamify -d dreamify"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dreamify-postgres:/var/lib/postgresql/data

volumes:
  dreamify-postgres:
