name: Workflow and Sandbox

on:
  pull_request:
    paths:
      - "apps/web/workflows/**"
      - "apps/web/src/server/workflow-runtime.ts"
      - "services/morpheus-sandbox/**"
      - "packages/contracts/**"
      - "packages/demo-fixtures/**"
      - "packages/workflow/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sandbox.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/workflows/**"
      - "apps/web/src/server/workflow-runtime.ts"
      - "services/morpheus-sandbox/**"
      - "packages/contracts/**"
      - "packages/demo-fixtures/**"
      - "packages/workflow/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sandbox.yml"

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @dreamify/workflow
      - run: npm run test --workspace @dreamify/workflow
      - run: npm run build --workspace @dreamify/workflow
      - run: npm run check --workspace @dreamify/contracts
      - run: npm run typecheck --workspace @dreamify/demo-fixtures
      - run: npm run test --workspace @dreamify/demo-fixtures

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/morpheus-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/morpheus-sandbox/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install ruff==0.16.1
      - run: python -m ruff format --check runner tests
      - run: python -m ruff check --select E,F,I runner tests
      - run: python -m pytest -q tests
