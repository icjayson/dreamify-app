version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - dreamify-network

  backend:
    build:
      context: ../dreamify-backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FASTAPI_DEBUG=true
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=5000
    volumes:
      - ../dreamify-backend:/app
    networks:
      - dreamify-network

networks:
  dreamify-network:
    driver: bridge

volumes:
  node_modules:
